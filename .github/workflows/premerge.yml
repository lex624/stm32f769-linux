# Premerge checks: the Robot suite's hardware-free tests on a GitHub-hosted runner.
# Hardware tests run on the self-hosted bench runner in a separate workflow and
# must never be triggered by pull requests (this repository is public).
name: premerge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  robot-premerge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # BLD-06 scans the whole git history for secrets, not just this commit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robot/requirements.txt

      - name: Install Robot Framework, ruff and shellcheck
        run: pip install -r robot/requirements.txt

      # gcc is already on ubuntu-latest. gitleaks is a pinned release, checked
      # against its published SHA-256 before use.
      - name: Install gitleaks 8.21.2
        env:
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # REQUIRE_ALL_TOOLS: in CI a missing tool fails its test instead of skipping it
      - name: Run premerge tests
        run: robot --argumentfile robot/args/premerge.args --variable REQUIRE_ALL_TOOLS:True robot/suites/System_Test_Suite

      - name: Upload Robot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-premerge-results
          path: robot/output/premerge
          if-no-files-found: error
